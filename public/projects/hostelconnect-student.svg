    <text x="528" y="486" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b8983">Dhankawadi, Pune · Any gender</text>
    <line x1="528" y1="506" x2="912" y2="506" stroke="#f2efe9" stroke-opacity="0.07"/>
    <text x="528" y="540" font-family="monospace" font-size="24" font-weight="700" fill="#8abbff">₹8,500</text>
    <text x="624" y="540" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">/mo</text>
    <text x="528" y="566" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">Single occupancy · 1.1 km</text>
    <rect x="528" y="582" width="104" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="580" y="601" font-family="monospace" font-size="9.5" fill="#4ade80" text-anchor="middle">3 BEDS FREE</text>
    <rect x="800" y="580" width="112" height="34" rx="17" fill="#f2efe9" fill-opacity="0.95"/>
    <text x="856" y="602" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#0a0b0d" text-anchor="middle">Request bed</text>
  </g>

  <!-- listing card 3 -->
  <g>
    <rect x="960" y="352" width="432" height="300" rx="16" fill="#111316" stroke="#f2efe9" stroke-opacity="0.09"/>
    <rect x="984" y="376" width="72" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="1020" y="392" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">HOSTEL</text>
    <text x="1368" y="392" font-family="monospace" font-size="10.5" fill="#b9b6b0" text-anchor="end">★ 4.5</text>
    <text x="984" y="440" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#f2efe9">Student Haven</text>
    <text x="984" y="486" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b8983">Katraj, Pune · Boys</text>
    <line x1="984" y1="506" x2="1368" y2="506" stroke="#f2efe9" stroke-opacity="0.07"/>
    <text x="984" y="540" font-family="monospace" font-size="24" font-weight="700" fill="#8abbff">₹6,800</text>
    <text x="1080" y="540" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">/mo</text>
    <text x="984" y="566" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">Twin sharing · 3.0 km</text>
    <rect x="984" y="582" width="62" height="30" rx="15" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.28"/>
    <text x="1015" y="601" font-family="monospace" font-size="9.5" fill="#fb7185" text-anchor="middle">FULL</text>
    <rect x="1256" y="580" width="112" height="34" rx="17" fill="#f2efe9" fill-opacity="0.08" stroke="#f2efe9" stroke-opacity="0.1"/>
    <text x="1312" y="602" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#7d7b76" text-anchor="middle">Notify me</text>
  </g>

  <!-- booking status strip -->
  <rect x="48" y="676" width="1344" height="150" rx="16" fill="#0d0f12" stroke="#f2efe9" stroke-opacity="0.08"/>
  <text x="76" y="710" font-family="monospace" font-size="10.5" fill="#7d7b76" letter-spacing="1.4">MY BOOKING REQUEST</text>
  <text x="1364" y="710" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76" text-anchor="end">Urban Nest Residency · 1 bed</text>
  <g font-family="monospace" font-size="10.5" letter-spacing="0.8">
    <rect x="76" y="730" width="140" height="38" rx="9" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3"/>
    <text x="146" y="754" fill="#fbbf24" text-anchor="middle">PENDING</text>
    <text x="232" y="754" fill="#7d7b76">→</text>
    <rect x="260" y="730" width="140" height="38" rx="9" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="330" y="754" fill="#4ade80" text-anchor="middle">APPROVED</text>
    <text x="416" y="754" fill="#7d7b76">→</text>
    <rect x="444" y="730" width="140" height="38" rx="9" fill="#4f9dff" fill-opacity="0.12" stroke="#4f9dff" stroke-opacity="0.3"/>
    <text x="514" y="754" fill="#8abbff" text-anchor="middle">MOVED IN</text>
  </g>
  <text x="76" y="796" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">Requests are approved or rejected by the property manager — the student can track the state of the request here.</text>
  <text x="1364" y="796" font-family="monospace" font-size="10" fill="#7d7b76" text-anchor="end" letter-spacing="1.2">RECONSTRUCTED UI</text>
</svg>
