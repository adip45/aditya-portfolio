<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Reconstructed student dashboard for HostelConnect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/><stop offset="1" stop-color="#8abbff"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g stroke="#8abbff" stroke-opacity="0.045">
    <path d="M0 90h1440M0 240h1440M0 390h1440M0 540h1440M0 690h1440M0 840h1440"/>
    <path d="M120 0v900M360 0v900M600 0v900M840 0v900M1080 0v900M1320 0v900"/>
  </g>

  <!-- top bar -->
  <rect x="48" y="44" width="1344" height="66" rx="14" fill="#111316" stroke="#f2efe9" stroke-opacity="0.09"/>
  <rect x="72" y="62" width="30" height="30" rx="8" fill="url(#accent)" opacity="0.9"/>
  <text x="118" y="83" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#f2efe9">HostelConnect</text>
  <text x="118" y="97" font-family="monospace" font-size="8.5" fill="#7d7b76" letter-spacing="1.4">STUDENT WORKSPACE</text>
  <rect x="1158" y="60" width="86" height="34" rx="17" fill="#4f9dff" fill-opacity="0.14" stroke="#4f9dff" stroke-opacity="0.35"/>
  <text x="1201" y="82" font-family="monospace" font-size="11" fill="#8abbff" text-anchor="middle" letter-spacing="1">STUDENT</text>
  <circle cx="1296" cy="77" r="17" fill="#1f2328" stroke="#f2efe9" stroke-opacity="0.12"/>
  <text x="1296" y="82" font-family="monospace" font-size="11" fill="#b9b6b0" text-anchor="middle">AP</text>

  <!-- page title -->
  <text x="48" y="168" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#f2efe9">Find a place to stay</text>
  <text x="48" y="192" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b8983">Hostels and PGs near your campus, with live bed availability.</text>

  <!-- search -->
  <rect x="48" y="216" width="1344" height="54" rx="12" fill="#0d0f12" stroke="#f2efe9" stroke-opacity="0.08"/>
  <circle cx="78" cy="243" r="7" fill="none" stroke="#7d7b76" stroke-width="1.6"/>
  <path d="M83 248l6 6" stroke="#7d7b76" stroke-width="1.6"/>
  <text x="102" y="248" font-family="system-ui,sans-serif" font-size="13" fill="#7d7b76">Search by city, property name or area</text>

  <!-- filter chips -->
  <g font-family="monospace" font-size="10.5" letter-spacing="0.8">
    <rect x="48" y="290" width="106" height="32" rx="16" fill="#4f9dff" fill-opacity="0.12" stroke="#4f9dff" stroke-opacity="0.3"/>
    <text x="101" y="311" fill="#8abbff" text-anchor="middle">ALL TYPES</text>
    <rect x="164" y="290" width="92" height="32" rx="16" fill="#0d0f12" stroke="#f2efe9" stroke-opacity="0.1"/>
    <text x="210" y="311" fill="#b9b6b0" text-anchor="middle">HOSTEL</text>
    <rect x="266" y="290" width="68" height="32" rx="16" fill="#0d0f12" stroke="#f2efe9" stroke-opacity="0.1"/>
    <text x="300" y="311" fill="#b9b6b0" text-anchor="middle">PG</text>
    <rect x="344" y="290" width="164" height="32" rx="16" fill="#0d0f12" stroke="#f2efe9" stroke-opacity="0.1"/>
    <text x="426" y="311" fill="#b9b6b0" text-anchor="middle">MAX BUDGET ₹9,000</text>
  </g>
  <text x="1392" y="311" font-family="monospace" font-size="10.5" fill="#7d7b76" text-anchor="end" letter-spacing="1">3 PROPERTIES</text>

