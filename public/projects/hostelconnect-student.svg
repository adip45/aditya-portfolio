    <rect x="48" y="352" width="432" height="300" rx="16" fill="#111316" stroke="#f2efe9" stroke-opacity="0.09"/>
    <rect x="48" y="352" width="432" height="112" rx="16" fill="url(#accent)" fill-opacity="0.07"/>
    <rect x="72" y="376" width="72" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="108" y="392" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">HOSTEL</text>
    <text x="456" y="392" font-family="monospace" font-size="10.5" fill="#b9b6b0" text-anchor="end">★ 4.8</text>
    <text x="72" y="440" font-family="system-ui,sans-serif" font-size="21" font-weight="600" fill="#f2efe9">Urban Nest Residency</text>
    <text x="72" y="486" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b8983">Katraj, Pune · Any gender</text>
    <line x1="72" y1="506" x2="456" y2="506" stroke="#f2efe9" stroke-opacity="0.07"/>
    <text x="72" y="540" font-family="monospace" font-size="24" font-weight="700" fill="#8abbff">₹7,500</text>
    <text x="168" y="540" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">/mo</text>
    <text x="72" y="566" font-family="system-ui,sans-serif" font-size="11" fill="#7d7b76">Single &amp; twin sharing · 2.4 km</text>
    <rect x="72" y="582" width="104" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="124" y="601" font-family="monospace" font-size="9.5" fill="#4ade80" text-anchor="middle">6 BEDS FREE</text>
    <rect x="344" y="580" width="112" height="34" rx="17" fill="#f2efe9" fill-opacity="0.95"/>
    <text x="400" y="602" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#0a0b0d" text-anchor="middle">Request bed</text>
  </g>

  <!-- listing card 2 -->
  <g>
    <rect x="504" y="352" width="432" height="300" rx="16" fill="#111316" stroke="#f2efe9" stroke-opacity="0.09"/>
    <rect x="504" y="352" width="432" height="112" rx="16" fill="url(#accent)" fill-opacity="0.05"/>
    <rect x="528" y="376" width="60" height="24" rx="12" fill="#4f9dff" fill-opacity="0.12" stroke="#4f9dff" stroke-opacity="0.3"/>
